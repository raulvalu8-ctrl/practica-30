<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Generador de Usuario e Iniciales</title>
    <style>
        body { font-family: sans-serif; margin: 40px; }
        .container { max-width: 450px; padding: 25px; border: 1px solid #eee; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .campo { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input { padding: 8px; width: 90%; }
        button { padding: 10px 20px; background-color: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; }
        #resultado { margin-top: 25px; line-height: 1.8; font-family: monospace; font-size: 1.1rem; }
    </style>
</head>
<body>

<div class="container">
    <h2>Registro de Usuario</h2>
    <form id="userForm">
        <div class="campo">
            <label>Nombre:</label>
            <input type="text" id="nombre" placeholder="Ej. Juan" required>
        </div>
        <div class="campo">
            <label>Apellido:</label>
            <input type="text" id="apellido" placeholder="Ej. Lopez" required>
        </div>
        <button type="submit">Generar Datos</button>
    </form>

    <div id="resultado"></div>
</div>

<script>
    document.getElementById('userForm').addEventListener('submit', function(e) {
        e.preventDefault();

        // 1. Obtener valores y quitar espacios accidentales a los lados
        const nombre = document.getElementById('nombre').value.trim();
        const apellido = document.getElementById('apellido').value.trim();

        // 2. Crear nombre de usuario (unir y pasar a minúsculas)
        const usuario = (nombre + apellido).toLowerCase();

        // 3. Obtener iniciales (primer carácter de cada uno en mayúsculas)
        // Usamos [0] para obtener la primera letra
        const iniciales = (nombre[0] + apellido[0]).toUpperCase();

        // 4. Mostrar resultado con el formato solicitado
        const resultadoDiv = document.getElementById('resultado');
        resultadoDiv.innerHTML = `Nombre de usuario: ${usuario}<br>Iniciales: ${iniciales}`;
    });
</script>

</body>
</html>
